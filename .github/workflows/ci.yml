name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Run Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Cache Derived Data
      uses: actions/cache@v4
      with:
        path: ~/Library/Developer/Xcode/DerivedData
        key: ${{ runner.os }}-derived-data-${{ hashFiles('**/*.swift') }}
        restore-keys: |
          ${{ runner.os }}-derived-data-
          
    - name: Resolve Dependencies
      run: |
        xcodebuild -resolvePackageDependencies -project ReadForge.xcodeproj

    - name: Select iOS Simulator
      run: |
        UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
        test -n "$UDID" || { echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1; }
        echo "Using simulator $UDID"
        echo "SIM_DEST=id=$UDID" >> "$GITHUB_ENV"

    - name: Build Project
      run: |
        xcodebuild -project ReadForge.xcodeproj \
                   -scheme ReadForge \
                   -destination "$SIM_DEST" \
                   clean build

    - name: Run Unit Tests
      run: |
        xcodebuild test \
                   -project ReadForge.xcodeproj \
                   -scheme ReadForge \
                   -destination "$SIM_DEST" \
                   -enableCodeCoverage YES \
                   -resultBundlePath TestResults.xcresult

    - name: Run UI Tests
      run: |
        xcodebuild test \
                   -project ReadForge.xcodeproj \
                   -scheme ReadForge \
                   -destination "$SIM_DEST" \
                   -only-testing:ReadForgeUITests \
                   -resultBundlePath UITestResults.xcresult
                   
    - name: Generate Code Coverage Report
      run: |
        xcrun xccov view --report --json TestResults.xcresult > coverage.json
        
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          TestResults.xcresult
          UITestResults.xcresult
          coverage.json
          
    - name: Comment Coverage on PR
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          try {
            const coverage = JSON.parse(fs.readFileSync('coverage.json', 'utf8'));
            const totalCoverage = coverage.targets[0]?.lineCoverage || 0;
            
            const comment = `## 📊 Code Coverage Report\n\n**Line Coverage: ${(totalCoverage * 100).toFixed(1)}%**\n\n${totalCoverage >= 0.8 ? '✅ Coverage is above 80%' : '⚠️ Coverage is below 80%'}`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
          } catch (error) {
            console.log('Could not parse coverage report:', error);
          }

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy Results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  performance-test:
    name: Performance Tests
    runs-on: macos-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Select iOS Simulator
      run: |
        UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
        test -n "$UDID" || { echo "No iPhone simulator available"; xcrun simctl list devices available; exit 1; }
        echo "Using simulator $UDID"
        echo "SIM_DEST=id=$UDID" >> "$GITHUB_ENV"

    - name: Run Performance Tests
      run: |
        xcodebuild test \
                   -project ReadForge.xcodeproj \
                   -scheme ReadForge \
                   -destination "$SIM_DEST" \
                   -only-testing:ReadForgeTests/DocumentProcessingIntegrationTests/testDocumentImportToProcessingPipeline \
                   -only-testing:ReadForgeTests/DocumentProcessingIntegrationTests/testPDFExtractionService \
                   -resultBundlePath PerformanceResults.xcresult
                   
    - name: Upload Performance Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-results
        path: PerformanceResults.xcresult

  build-archive:
    name: Build and Archive
    runs-on: macos-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Import Code-Signing Certificates
      if: github.event_name != 'pull_request'
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        
        # Import certificate
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH
        
        # Import provisioning profile
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
        
    - name: Build Archive
      run: |
        xcodebuild archive \
                   -project ReadForge.xcodeproj \
                   -scheme ReadForge \
                   -configuration Release \
                   -archivePath $RUNNER_TEMP/ReadForge.xcarchive \
                   -destination generic/platform=iOS \
                   CODE_SIGN_STYLE=Manual \
                   PROVISIONING_PROFILE_SPECIFIER="" \
                   CODE_SIGN_IDENTITY=""
                   
    - name: Export Archive
      run: |
        xcodebuild -exportArchive \
                   -archivePath $RUNNER_TEMP/ReadForge.xcarchive \
                   -exportOptionsPlist ExportOptions.plist \
                   -exportPath $RUNNER_TEMP/build
                   
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReadForge-iOS
        path: $RUNNER_TEMP/build
        retention-days: 30

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test]
    if: always()
    
    steps:
    - name: Notify Slack on Success
      if: needs.test.result == 'success' && needs.security-scan.result == 'success'
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#ci-cd'
        text: '✅ ReadForge CI/CD Pipeline completed successfully!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
        
    - name: Notify Slack on Failure
      if: needs.test.result == 'failure' || needs.security-scan.result == 'failure'
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#ci-cd'
        text: '❌ ReadForge CI/CD Pipeline failed!'
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
